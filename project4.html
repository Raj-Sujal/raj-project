<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squid Game</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
}

.container{
min-height:100vh;
padding:20px 60px;
color:#fff;
background:linear-gradient(90deg,#12030a,#390018,#220043);
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff2d75;
}

.menu{
display:flex;
gap:35px;
list-style:none;
}

.hero{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:40px;
}

.left{
width:48%;
}

.title{
font-size:90px;
font-weight:bold;
line-height:90px;
}

.title span{
color:#ff2d75;
}

.text{
margin-top:20px;
font-size:18px;
line-height:30px;
color:#ddd;
}

.btns{
margin-top:30px;
display:flex;
gap:20px;
}

.btn1{
padding:15px 35px;
border:none;
border-radius:10px;
font-size:18px;
color:#fff;
background:linear-gradient(to right,#ff2d75,#ff9a00);
}

.btn2{
padding:15px 35px;
border:2px solid #ff2d75;
border-radius:10px;
font-size:18px;
color:#fff;
background:transparent;
}

.right{
width:42%;
}

.right img{
width:100%;
}

.cards{
display:flex;
gap:20px;
margin-top:40px;
}

.card{
flex:1;
height:180px;
border-radius:18px;
overflow:hidden;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>

<body>

<div class="container">

<div class="navbar">
<div class="logo">SQUID <span>GAME</span></div>

<ul class="menu">
<li>About</li>
<li>Watch now</li>
<li>Actors</li>
<li>Contact</li>
</ul>

<div>☰</div>
</div>

<div class="hero">

<div class="left">
<div class="title">SQUID<br><span>GAME</span></div>

<div class="text">
Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br>
Season 1 : 9 Episodes
</div>

<div class="btns">
<button class="btn1">Play Now</button>
<button class="btn2">Watch Trailer</button>
</div>
</div>

<div class="right">
<img src="https://images.unsplash.com/photo-1618005198919-d3d4b5a92eee?auto=format&fit=crop&w=700&q=80">
</div>

</div>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=500&q=80">
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=500&q=80">
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=500&q=80">
</div>

</div>

</div>

</body>
</html>
