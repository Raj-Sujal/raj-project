<!DOCTYPE html>
<html>
<head>
<title>FlexFit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#111;
    overflow:hidden;
}

.main{
    width:100%;
    height:100vh;
    padding:8px;
}

.box{
    width:24%;
    height:180px;
    background:white;
    float:left;
    margin:5px;
    border-radius:18px;
    padding:15px;
}

.yellow{
    background:gold;
}

.pink{
    background:#f6c9c9;
}

.big{
    width:49%;
}

.tall{
    height:365px;
}

h1{
    font-size:42px;
    margin-top:30px;
}

h2{
    font-size:28px;
}

p{
    font-size:18px;
    margin-top:10px;
}

img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:12px;
}

.btn{
    background:black;
    color:white;
    padding:8px 15px;
    display:inline-block;
    margin-top:15px;
    border-radius:8px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="main">

<div class="box tall">
<img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e">
<p>35 MIN</p>
<p>NO EXCUSES</p>
<p>7 DAYS</p>
</div>

<div class="box yellow">
<h2>USE OUR APP FOR QUALITY WORKOUT!</h2>
<div class="btn">Google Play</div>
<div class="btn">App Store</div>
</div>

<div class="box">
<p>HEADINGS FONT</p>
<h2>SUISSE BP</h2>
<p>BODY FONT</p>
<h2>SUISSE</h2>
</div>

<div class="box tall">
<h1>OWN YOUR STRENGTH</h1>
</div>

<div class="box">
<h2>REDEFINE YOUR LIMITS</h2>
<p>Luxury Fitness</p>
</div>

<div class="box big">
<h1>FlexFit</h1>
</div>

<div class="box pink">
<p>12384 FITNESS LN</p>
<p>BROOKLYN, NY</p>
</div>

<div class="box yellow">
<h2>TRAIN WITH BEST TRAINERS</h2>
<h1>48+</h1>
</div>

<div class="box">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330">
</div>

<div class="box pink tall">
<img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d">
<h2>UNLOCK YOUR POTENTIAL</h2>
<div class="btn">SIGN UP</div>
</div>

</div>

</body>
</html>
